[project]
name = "folkbook-backend"
version = "0.1.0"
description = "FolkBook backend: Django + Django Ninja API"
license = "AGPL-3.0-or-later"
requires-python = ">=3.12"
dependencies = [
    "django>=6.1.1",
    "django-ninja>=1.7.1",
    "django-tasks-db>=0.13.0",
    "gunicorn>=26.2.0",
    "pillow>=12.3.0",
    "psycopg[binary]>=3.3.6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
addopts = "--strict-markers --import-mode=importlib"
# Fix deprecations when they appear, not when the next upgrade breaks something.
filterwarnings = ["error::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "DJ", "SIM", "RUF"]
ignore = [
    # Names like "Yılmaz" and typographic dashes are real text, not look-alike characters.
    "RUF001",
    "RUF002",
    "RUF003",
    "RUF012", # Django's class attributes (Meta, admin options) are lists by convention
]

[dependency-groups]
dev = [
    "factory-boy>=3.3.3",
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
    "ruff>=0.16.8",
]
