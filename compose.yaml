name: folkbook

# Settings shared by everything that runs the backend image.
x-backend: &backend
  build: ./backend
  image: folkbook-backend
  restart: unless-stopped
  env_file: .env
  environment:
    POSTGRES_HOST: db

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-folkbook}
      POSTGRES_USER: ${POSTGRES_USER:-folkbook}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # The API. Runs migrations on start; healthy once it answers.
  backend:
    <<: *backend
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - django_static:/app/staticfiles
      - media_data:/app/media
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"
      interval: 10s
      timeout: 5s
      retries: 12

  # Runs background jobs (emails, reminders, housekeeping).
  worker:
    <<: *backend
    entrypoint: ["python", "manage.py"]
    command: ["db_worker"]
    depends_on:
      backend:
        condition: service_healthy

  # Queues the periodic jobs when they're due.
  scheduler:
    <<: *backend
    entrypoint: ["python", "manage.py"]
    command: ["run_scheduler"]
    depends_on:
      backend:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: caddy/Dockerfile
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "${FOLKBOOK_PORT:-8080}:80"
    depends_on:
      - backend
    volumes:
      - django_static:/srv/django-static:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  db_data:
  media_data: # profile photos; back up together with db_data
  django_static:
  caddy_data:
  caddy_config:
